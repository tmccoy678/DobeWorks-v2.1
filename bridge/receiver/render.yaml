services:
  - type: web
    name: bridge-receiver
    runtime: python
    # stdlib only — no build step needed
    buildCommand: "true"
    startCommand: python receiver.py
    envVars:
      - key: BIND
        value: 0.0.0.0
      # PORT is set automatically by Render; receiver.py reads it.
      - key: BRIDGE_TOKEN
        sync: false # set manually in the Render dashboard (long random secret)
      - key: BRIDGE_STORE
        value: /tmp/bridge_messages.jsonl
